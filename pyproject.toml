[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "bhaptics-http"
version     = "0.2.0"
description = "HTTP REST bridge for bHaptics haptic hardware — raw dot patterns, no Studio required"
readme      = "README.md"
license       = "MIT"
license-files = ["LICENSE"]
authors     = [{ name = "S.C. Vollmer" }]
keywords    = [
    "bhaptics", "haptics", "tactile", "XR", "VR", "wearables",
    "TactSuit", "rest", "api", "bridge", "WSL2"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies    = [
    "bhaptics-python>=0.2.2",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "aiohttp[speedups]",
]

[project.urls]
Homepage      = "https://github.com/MissCrispenCakes/bhaptics-http"
Documentation = "https://github.com/MissCrispenCakes/bhaptics-http#readme"
Issues        = "https://github.com/MissCrispenCakes/bhaptics-http/issues"
Changelog     = "https://github.com/MissCrispenCakes/bhaptics-http/blob/basecamp/CHANGELOG.md"
Citation      = "https://doi.org/10.5281/zenodo.19025338"

[project.scripts]
bhaptics-http = "bhaptics_http.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bhaptics_http"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "docs/",
    "examples/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
